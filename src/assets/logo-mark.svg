<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="hx-t">
  <title id="hx-t">Hexis</title>
  <!-- The Hexis mark on a transparent ground, for headers, the unlock screen and the sidebar (dark backgrounds). -->
  <defs>
    <linearGradient id="hx-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD5E1"/></linearGradient>
    <linearGradient id="hx-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94A3B8"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="hx-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  </defs>
  <g transform="translate(-6 4)">
  <g id="hx-pillars">
    <rect x="40" y="48" width="44" height="160" fill="url(#hx-face)"/>
    <polygon points="40,48 84,48 96,40 52,40" fill="#FFFFFF"/>
    <polygon points="84,48 96,40 96,200 84,208" fill="url(#hx-side)"/>
    <rect x="172" y="48" width="44" height="160" fill="url(#hx-face)"/>
    <polygon points="172,48 216,48 228,40 184,40" fill="#FFFFFF"/>
    <polygon points="216,48 228,40 228,200 216,208" fill="url(#hx-side)"/>
  </g>
  <g id="hx-layers">
    <polygon points="84,140 172,124 172,160 84,176" fill="url(#hx-accent)" fill-opacity="0.92"/>
    <polygon points="84,140 172,124 172,127 84,143" fill="#FFFFFF" fill-opacity="0.45"/>
    <polygon points="84,84 172,68 172,108 84,124" fill="url(#hx-face)"/>
  </g>
  </g>
</svg>
