name: Bug report
description: Something does not work as described. Security problems do NOT go here (see SECURITY.md).
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real passwords, vault files, one-time-code seeds or exports.** Reproduce the problem with a
        throw-away vault and made-up data. Security vulnerabilities: use the repository's **Security** tab, not an issue.
  - type: dropdown
    id: variant
    attributes:
      label: Which build
      options:
        - Linux .deb
        - Linux .rpm
        - Linux AppImage
        - Linux tar.gz or built from source
        - Arch PKGBUILD
        - Android APK
        - Browser preview (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version in Settings, the release tag, or `nightly` plus the date.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and device
      description: For example "Fedora 44, Wayland" or "Android 15, Pixel 8".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create a vault called Test\n2. ..."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The exact error text you saw, and for an import problem the app the file came from and the *shape* of the problem (not the data).
