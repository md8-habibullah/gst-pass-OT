# Builds the project website from the repository's Markdown (scripts/build-site.mjs) and deploys it to GitHub Pages.
# One-time setup: scripts/github-setup.sh sets the Pages source to "GitHub Actions" (do that BEFORE the first push).
# The same build also runs, without deploying, as the `site` job of ci.yml, which fails on a broken link or anchor.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "ai-docs/**"
      - "e2e/README.md"
      - "site/**"
      - "scripts/build-site.mjs"
      - "src-tauri/icons/128x128.png"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with: { path: site-dist }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
