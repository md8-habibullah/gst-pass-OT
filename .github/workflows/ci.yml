# CI and release pipeline.
#
#   every push and pull request   checks, e2e, site, linux bundles and android apk start together (the slowest one sets the
#                                  time; artifacts are kept for 14 days). linux bundles -> installer: the one-line installer
#                                  on real distributions. Nothing is published until every one of them has passed.
#   push to main                  ... then replaces the rolling `nightly` pre-release with those artifacts
#   push to main with a NEW version   (the version in src-tauri/tauri.conf.json has no `vX.Y.Z` tag yet)
#                                  ... and, only when every job above has passed, tags that commit and PUBLISHES the release.
#                                  Nothing is tagged or published by hand: raising the version on main is the release.
#
# Only GitHub's own actions are used (checkout, setup-node, setup-java, cache, upload/download-artifact) and the
# preinstalled `gh` CLI: no third-party action runs in this pipeline, so nothing outside GitHub can alter a build.
# Releases and caches are never shared: a build that is going to publish a release starts from a clean cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # `gh workflow run CI` on main repeats a release whose tag and release were deleted

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an unfinished run of the same branch, never a run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  NODE_VERSION: "24"
  # Tauri's Linux prerequisites (Debian / Ubuntu), see ai-docs/BUILD_TARGETS.md section 2.
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  # ------------------------------------------------------------------------------------------------------------------
  # Decides, in seconds, whether this run is going to publish a release: a push to main whose version has no tag yet.
  # The tag is the marker, so a release made by hand (or a draft) counts too and is never made twice. When a release is
  # planned, a version that disagrees between package.json, tauri.conf.json and Cargo.toml, or a CHANGELOG.md without a
  # section for it, fails here, before anything is built.
  plan:
    name: Is this a new version?
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1); then
              msg="v$version already has a tag: an ordinary build, nothing is published."
            elif printf '%s' "$out" | grep -q "Not Found"; then
              release=true
              msg="v$version has no tag yet: if every job passes, this commit is tagged and published as release v$version."
            else
              echo "::error::could not tell whether v$version exists: $out"; exit 1
            fi
          else
            msg="Not a push to main: an ordinary build, nothing is published."
          fi
          echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$release" = true ]; then
            # VERSION is the one source of truth; every file that carries the version, and the CHANGELOG section, must agree with it
            [ "$(cat VERSION)" = "$version" ] || { echo "::error::VERSION ($(cat VERSION)) and src-tauri/tauri.conf.json ($version) differ. Run: python3 scripts/version.py sync"; exit 1; }
            python3 scripts/version.py check --release || { echo "::error::The version files or the CHANGELOG disagree with VERSION (see the lines above). Run: python3 scripts/version.py set $(cat VERSION)"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------------------------
  checks:
    name: Checks (types, tests, rustfmt, clippy, cargo test)
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS librsvg2-bin
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Cargo cache
        if: needs.plan.outputs.release != 'true' # a build that publishes a release starts from a clean cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-checks-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-checks-${{ runner.os }}-
      - run: npm ci
      - name: Every project check
        run: scripts/verify_all.sh

  # ------------------------------------------------------------------------------------------------------------------
  e2e:
    name: End-to-end (real Rust core, headless Chrome)
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CHROME_BIN: google-chrome
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        if: needs.plan.outputs.release != 'true' # a build that publishes a release starts from a clean cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-
      - run: npm ci
      - run: google-chrome --version
      - name: Build the dev shim, start Vite, run every e2e script
        run: scripts/ci_e2e.sh

  # ------------------------------------------------------------------------------------------------------------------
  site:
    name: Website builds and every link resolves
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: node scripts/build-site.mjs

  # ------------------------------------------------------------------------------------------------------------------
  linux:
    name: Linux bundles (deb, rpm, AppImage, tar.gz)
    needs: plan
    runs-on: ubuntu-22.04 # the oldest glibc we support: bundles built here run on newer distributions
    timeout-minutes: 60
    env:
      NO_STRIP: "true" # known linuxdeploy 'strip' failure with recent toolchains
      APPIMAGE_EXTRACT_AND_RUN: "1" # runners have no FUSE
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        if: needs.plan.outputs.release != 'true' # a build that publishes a release starts from a clean cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-registry-${{ runner.os }}-
      - run: npm ci
      - name: Build the bundles
        # The AppImage step downloads linuxdeploy from GitHub's release CDN, which answers 503 now and then (the push
        # of 2026-11-25 went red that way after a good compile and good deb and rpm bundles). A second attempt reuses
        # the compiled release build, so a retry costs seconds; a real error still fails after the third attempt.
        run: |
          for attempt in 1 2 3; do
            npm run tauri build -- --bundles deb,rpm,appimage && exit 0
            echo "::warning::bundling failed on attempt $attempt of 3, trying again shortly"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Collect, name and archive
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out=release-files; mkdir -p "$out" "pkg/hexis-$VERSION"
          B=src-tauri/target/release/bundle
          cp "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage "$out"/
          install -Dm755 src-tauri/target/release/hexis "pkg/hexis-$VERSION/hexis"
          install -Dm644 packaging/hexis.desktop "pkg/hexis-$VERSION/hexis.desktop"
          install -Dm644 src-tauri/icons/128x128.png "pkg/hexis-$VERSION/hexis.png"
          install -Dm644 LICENSE "pkg/hexis-$VERSION/LICENSE"
          tar -C pkg -czf "$out/hexis-$VERSION-linux-x86_64.tar.gz" "hexis-$VERSION"
          ls -l "$out"
      - name: The built packages work as the browser's native host
        # What is shipped, not a debug build: the binary inside the deb, and the AppImage started through a launcher written the
        # way the app writes it (an AppImage has no fixed path, so that launcher is what a browser runs). Standard output must
        # hold one framed message and nothing else; a stray line from a wrapper breaks every passkey request.
        run: |
          set -euo pipefail
          deb_root="$RUNNER_TEMP/deb-root"; mkdir -p "$deb_root"
          dpkg-deb -x release-files/*.deb "$deb_root"
          python3 scripts/check_packaged_host.py "$deb_root/usr/bin/hexis" --via-launcher
          python3 scripts/check_packaged_host.py release-files/*.AppImage --via-launcher --extract-and-run --timeout 180
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------------------------------
  installer:
    name: One-line installer on ${{ matrix.spec }}
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # image[=expectation]: the installer must work on these, and must turn the last two away with a clear reason.
        spec:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - opensuse/tumbleweed
          - archlinux:latest
          - alpine:3.20=refuse:musl
          - ubuntu:20.04=refuse:too old
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: linux-bundles, path: files }
      - name: Build signed repositories with a throw-away key, then install, start, reinstall and uninstall
        env:
          SPEC: ${{ matrix.spec }}
        run: scripts/test_installer_containers.sh files "$SPEC"

  # ------------------------------------------------------------------------------------------------------------------
  android:
    name: Android APK (arm64)
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      IS_RELEASE: ${{ needs.plan.outputs.release }}
      NDK_VERSION: "28.2.13676358"
      BUILD_TOOLS: "36.0.0"
      # Release signing: created and stored by `scripts/github-setup.sh android-key`. Pull requests never receive the key
      # (a forked repository has no secrets at all). Without it the APK is signed with a throw-away key made by this run,
      # which is fine for a test build but never for a build that publishes a release (see the signing step).
      KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
      KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
      ALLOW_TESTKEY_RELEASE: ${{ vars.ALLOW_TESTKEY_RELEASE }}
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" } # Gradle and the Android plugin do not run on newer JDKs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable
      - name: Android SDK pieces
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # NOTE: this line accepts Google's Android SDK licence on behalf of whoever owns this workflow file.
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Generate the Android project, apply the disguise and the screen-protection plugin
        run: |
          set -euo pipefail
          npm run tauri android init -- --ci --skip-targets-install
          # the launcher icons (adaptive foreground, background colour, themed monochrome) are kept in src-tauri/icons/android
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          python3 scripts/android_patch_manifest.py src-tauri/gen/android
          d=src-tauri/gen/android/app/src/main/java/dev/habibullah/hexis/securescreen
          mkdir -p "$d" && cp scripts/android/SecureScreenPlugin.kt "$d"/
          python3 scripts/check_no_notifications.py
      - name: Build the release APK (arm64)
        run: npm run tauri android build -- --apk --target aarch64
      - name: Align and sign
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n1)
          test -n "$APK" || { echo "no unsigned APK was produced"; find src-tauri/gen/android/app/build/outputs -type f; exit 1; }
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          mkdir -p release-files
          if [ -n "${KEYSTORE_B64:-}" ]; then
            if [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEY_ALIAS or ANDROID_KEYSTORE_PASSWORD is missing. Run scripts/github-setup.sh android-key."; exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
            KS=release.jks; ALIAS="$KEY_ALIAS"; KS_PASS="$KEYSTORE_PASSWORD"; K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"; SUFFIX=""
          else
            if [ "${IS_RELEASE:-}" = true ] && [ "${ALLOW_TESTKEY_RELEASE:-}" != true ]; then
              echo "::error::This build would publish a release but the Android release key is not in this repository's secrets. A release must not ship an APK signed with a throw-away key (phones could never update it). Run scripts/github-setup.sh android-key, then re-run this job. To publish anyway, set the repository variable ALLOW_TESTKEY_RELEASE to true."; exit 1
            fi
            echo "No release key configured: signing with a throw-away key. The file name says so."
            KS_PASS=$(openssl rand -hex 24); echo "::add-mask::$KS_PASS"; K_PASS="$KS_PASS"; ALIAS=ci
            keytool -genkeypair -keystore ephemeral.jks -storepass "$KS_PASS" -keypass "$K_PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Hexis CI test key" > /dev/null
            KS=ephemeral.jks; SUFFIX="-testkey"
          fi
          export KS_PASS K_PASS
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --v4-signing-enabled false --out "release-files/hexis-$VERSION-android-arm64$SUFFIX.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "release-files/hexis-$VERSION-android-arm64$SUFFIX.apk"
          rm -f release.jks ephemeral.jks
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------------------------------
  nightly:
    name: Publish the rolling nightly pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, linux, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/download-artifact@v8
        with: { path: files, merge-multiple: true }
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA::12} ($(date -u +%Y-%m-%d))."
            echo
            echo "Install the newest build on Linux: \`curl -fsS https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/install.sh | sh -s -- --nightly\`"
            echo
            echo "**Pre-release, not audited.** This replaces itself on every push to \`main\`. Check files with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo "The Android APK in this release is signed with a key that is not the project's release key unless the file name lacks \`-testkey\`; it cannot update an app installed from a different build."
          } > notes.md
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (main, ${GITHUB_SHA::7})" --notes-file notes.md files/*

  # ------------------------------------------------------------------------------------------------------------------
  release:
    name: Publish the release
    # Only when `plan` found a version without a tag, and only when every other job of this run has passed.
    if: needs.plan.outputs.release == 'true'
    needs: [plan, checks, e2e, site, linux, installer, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write # creates the tag and the release
      actions: write  # asks the Pages workflow to rebuild the site (see the last step)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # First step of every job: this machine's public details; the copies are kept identical by scripts/tests/test_ci_system_info.py
      - name: System details (public information only)
        continue-on-error: true
        run: |
          {
            echo "### System: ${GITHUB_JOB:-?} on ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
            echo '```'
            echo "time      $(date -u '+%Y-%m-%d %H:%M:%S') UTC   commit ${GITHUB_SHA:-?}"
            echo "runner    ${RUNNER_NAME:-?}   image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "system    $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release 2>/dev/null | tr -d '"'), kernel $(uname -r), $(uname -m)"
            echo "cpu       $(nproc) cores, $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
            echo "memory    $(free -h | awk '/^Mem:/{print $2" total, "$7" available"}'), swap $(free -h | awk '/^Swap:/{print $2}')"
            echo "disk      $(df -h / | awk 'NR==2{print $2" total, "$4" free"}') on /, $(df -h . | awk 'NR==2{print $4" free"}') in the workspace"
            echo "load      $(cut -d' ' -f1-3 /proc/loadavg)"
            for t in git node npm python3 rustc cargo java docker gh; do
              if command -v "$t" >/dev/null 2>&1; then printf '%-9s %s\n' "$t" "$( ("$t" --version 2>&1 || "$t" -version 2>&1) | head -n 1)"; fi
            done
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { path: files, merge-multiple: true }
      - name: Checksums, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # `gh release create --target` only places a NEW tag. If the tag appeared while this run was building (a manual tag,
          # a second run), the release would point at another commit than these files, so stop instead.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "::error::$TAG now exists, so this run will not publish it. Nothing was changed."; exit 1
          fi
          printf '%s' "$out" | grep -q "Not Found" || { echo "::error::could not check whether $TAG exists: $out"; exit 1; }
          cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          SITE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || echo "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}")
          # title, install commands, a downloads table with checksums and the changelog section: scripts/release_notes.py
          # APK_CERT is the public SHA-256 fingerprint of the Android release certificate (repository variable ANDROID_CERT_SHA256)
          python3 scripts/release_notes.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --site "$SITE" --sums files/SHA256SUMS ${APK_CERT:+--apk-cert "$APK_CERT"} > notes.md
          cat notes.md
          # A version with a suffix (0.3.0-rc1) is a pre-release: it never becomes "latest" and the package repositories ignore it.
          kind=(--latest); case "$VERSION" in *-*) kind=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${kind[@]}" \
            --title "Hexis $VERSION" --notes-file notes.md files/*
          echo "Published $TAG at ${GITHUB_SHA::7}." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the site, which carries the apt and rpm repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made with this job's token starts no workflow by itself (a GitHub rule against loops), but a manual
          # run of the Pages workflow is allowed. It builds the signed package repositories from the newest stable release.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            || echo "::warning::The release is published, but the Pages workflow could not be started. Run it by hand: gh workflow run pages.yml"
